<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Codex Claude Usage Setup</title>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="setup.css">
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <main class="setup">
    <header>
      <p class="eyebrow">Setup</p>
      <h1>Codex Claude Usage</h1>
      <h2 id="setup-headline" class="setup-headline">사용할 도구를 연결하세요</h2>
      <p id="setup-summary" class="summary">Codex CLI와 Claude Code 중 사용하는 도구 하나만 연결해도 시작할 수 있습니다.</p>
    </header>

    <section class="checks" aria-label="도구 연결">
      <article id="codex-card" class="check">
        <div>
          <h2 id="codex-heading" tabindex="-1">Codex CLI</h2>
          <p id="codex-detail" class="status-message">확인 중</p>
        </div>
        <button id="codex-login" type="button">확인 중</button>
      </article>

      <div id="claude-actions" class="provider-actions">
        <button id="claude-add" type="button">Claude Code 연결</button>
        <button id="claude-only" class="secondary-action" type="button">Claude Code로 시작</button>
      </div>

      <section id="claude-section" class="provider-section" aria-label="Claude Code 연결" hidden>
        <article class="check">
          <div>
            <h2 id="claude-heading" tabindex="-1">Claude Code</h2>
            <p id="claude-detail" class="status-message">확인 중</p>
          </div>
          <button id="claude-auth" type="button">확인 중</button>
        </article>

        <article id="claude-visibility-card" class="check">
          <div>
            <h2>앱에 Claude 표시</h2>
            <p id="claude-visibility-detail" class="status-message">확인 중</p>
          </div>
          <button id="claude-visibility" class="secondary-action" type="button">확인 중</button>
        </article>
      </section>

      <article id="codex-visibility-card" class="check" hidden>
        <div>
          <h2>앱에 Codex 표시</h2>
          <p id="codex-visibility-detail" class="status-message">확인 중</p>
        </div>
        <button id="codex-visibility" class="secondary-action" type="button">확인 중</button>
      </article>

      <div id="codex-add-action" class="provider-actions" hidden>
        <button id="codex-add" type="button">Codex CLI 연결</button>
      </div>
      <p id="provider-selection-status" class="sr-status" role="status" aria-live="polite"></p>
    </section>

    <section class="checks common-checks" aria-label="앱 설정">
      <article class="check">
        <div>
          <h2>화면 테마</h2>
          <p>모든 앱 화면에 적용되며 다음 실행에도 유지됩니다.</p>
        </div>
        <label class="select-control">
          <span class="sr-only">화면 테마</span>
          <select id="theme-select">
            <option value="dark">다크</option>
            <option value="light">라이트</option>
          </select>
        </label>
      </article>
      <article class="check">
        <div>
          <h2>로컬 토큰 상세</h2>
          <p id="details-detail">확인 중</p>
        </div>
        <button id="open-details" type="button">상세 열기</button>
      </article>

      <article class="check">
        <div>
          <h2>활동 중 자동 확인</h2>
          <p id="monitoring-detail">확인 중</p>
        </div>
        <label class="toggle">
          <input id="activity-monitoring" type="checkbox">
          <span>자동 확인</span>
        </label>
      </article>

      <article class="check">
        <div>
          <h2>앱 업데이트</h2>
          <p id="update-detail">업데이트 확인 기록을 불러오는 중입니다.</p>
        </div>
        <button id="check-update" type="button">업데이트 확인</button>
      </article>

      <article class="check">
        <div>
          <h2>Windows 시작 시 실행</h2>
          <p id="startup-detail">확인 중</p>
        </div>
        <label class="toggle">
          <input id="launch-at-login" type="checkbox">
          <span>자동 실행</span>
        </label>
      </article>
    </section>

    <p id="action-message" class="action-message" role="status" aria-live="polite"></p>

    <footer>
      <div class="onboarding-actions">
        <button id="setup-later" type="button">나중에</button>
        <button id="setup-complete" type="button" disabled>사용량 화면 열기</button>
      </div>
      <div class="status-actions">
        <button id="refresh" type="button">상태 다시 확인</button>
        <button id="collect" type="button">연결된 도구 사용량 확인</button>
      </div>
    </footer>
  </main>
  <script src="bridge.js"></script>
  <script src="setup-view.js"></script>
  <script src="setup.js"></script>
</body>
</html>
